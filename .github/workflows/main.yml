name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "Repository:"
          find . -maxdepth 3 -type f | sort | head -200

          PROJECT_DIR=""

          # Case 1: project is already in repository root
          if [ -f "./settings.gradle.kts" ] || [ -f "./settings.gradle" ]; then
            PROJECT_DIR="."
          fi

          # Case 2: repository contains a ZIP
          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -1 || true)

            if [ -n "$ZIP_FILE" ]; then
              echo "Found project ZIP: $ZIP_FILE"

              rm -rf extracted
              mkdir -p extracted
              unzip -q "$ZIP_FILE" -d extracted

              echo "Searching extracted project..."

              SETTINGS_FILE=$(find extracted \
                -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
                | head -1 || true)

              if [ -n "$SETTINGS_FILE" ]; then
                PROJECT_DIR=$(dirname "$SETTINGS_FILE")
              fi
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project was not found."
            exit 1
          fi

          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Gradle configuration
        shell: bash
        run: |
          set -e

          echo "Project:"
          ls -la "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: gradle-wrapper.properties not found."
            exit 1
          fi

          echo "Gradle wrapper properties:"
          cat "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

      - name: Install Gradle from wrapper properties
        shell: bash
        run: |
          set -e

          PROPERTIES="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

          DISTRIBUTION_URL=$(grep '^distributionUrl=' "$PROPERTIES" \
            | cut -d'=' -f2- \
            | sed 's/\\//g')

          if [ -z "$DISTRIBUTION_URL" ]; then
            echo "ERROR: distributionUrl not found."
            exit 1
          fi

          echo "Gradle distribution:"
          echo "$DISTRIBUTION_URL"

          mkdir -p "$HOME/gradle"

          curl -fL "$DISTRIBUTION_URL" -o "$HOME/gradle/gradle.zip"

          unzip -q "$HOME/gradle/gradle.zip" -d "$HOME/gradle"

          GRADLE_HOME=$(find "$HOME/gradle" -maxdepth 1 -type d -name "gradle-*" | head -1)

          if [ -z "$GRADLE_HOME" ]; then
            echo "ERROR: Gradle distribution could not be extracted."
            exit 1
          fi

          echo "GRADLE_HOME=$GRADLE_HOME"
          echo "$GRADLE_HOME/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle
        run: |
          gradle --version

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "Generated APK files:"
          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-BD-Debug-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
